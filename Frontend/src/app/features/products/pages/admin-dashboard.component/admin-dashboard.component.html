<div class="dashboard-layout">


  <div class="sidebar">

    <div class="sidebar-logo">

      <h2>
        Admin
      </h2>

    </div>

    <div class="sidebar-menu">

      <button
        (click)="selectedSection = 'create'"
        [class.active]="
          selectedSection === 'create'
        "
      >
        Create Product
      </button>

      <button
        (click)="selectedSection = 'update'"
        [class.active]="
          selectedSection === 'update'
        "
      >
        Update Product
      </button>

      <button
        (click)="selectedSection = 'delete'"
        [class.active]="
          selectedSection === 'delete'
        "
      >
        Delete Product
      </button>

      <button
        (click)="selectedSection = 'view'"
        [class.active]="
          selectedSection === 'view'
        "
      >
        View Products
      </button>

      <button
  (click)="selectedSection = 'invite'"
  [class.active]="
    selectedSection === 'invite'
  "
>
  Send Invite
</button>

    </div>

  </div>



  <div class="dashboard-content">

  

    <div *ngIf="selectedSection === 'create'">

      <div class="content-header">

        <h1>
          Create Product
        </h1>

        <p>
          Add products to inventory
        </p>

      </div>

      <div class="create-card">

        <form
          [formGroup]="productForm"
          (ngSubmit)="createProduct()"
        >

          <div class="form-group">

            <label>
              Product Name
            </label>

            <input
              type="text"
              formControlName="name"
            >

          </div>

          <div class="form-group">

            <label>
              Description
            </label>

            <textarea
              rows="4"
              formControlName="description"
            ></textarea>

          </div>

          <div class="form-row">

            <div class="form-group">

              <label>
                Price
              </label>

              <input
                type="number"
                formControlName="price"
              >

            </div>

            <div class="form-group">

              <label>
                Stock
              </label>

              <input
                type="number"
                formControlName="stock"
              >

            </div>
            <div>
        <input

        type="text"

        formControlName="imageUrl"

        placeholder="Enter image url"

        style="
          width:100%;
          padding:14px;
          border-radius:10px;
          border:1px solid #d1d5db;
        "
      >

</div>
          </div>

          <button
            type="submit"
            class="submit-btn"
          >
            Create Product
          </button>

        </form>

      </div>

    </div>


<div *ngIf="selectedSection === 'invite'">

  <div class="content-header">

    <h1>
      Send Invite
    </h1>

    <p>
      Invite team members
    </p>

  </div>

  <div class="create-card">

    <form
      [formGroup]="inviteForm"
      (ngSubmit)="sendInvite()"
    >

   
      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          formControlName="email"
        >

      </div>

    

      <div class="form-group">

        <label>
          Role
        </label>

        <select
          formControlName="role"
        >

          <option value="">
            Select Role
          </option>

          <option value="ProductManager">
            Product Manager
          </option>

          <option value="InventoryManager">
            Inventory Manager
          </option>

          <option value="DataAnalyst">
            Data Analyst
          </option>

        </select>

      </div>

      <button
        type="submit"
        class="submit-btn"
      >
        Send Invite
      </button>

    </form>

  </div>

</div>

    <div
      *ngIf="
        selectedSection === 'view' ||
        selectedSection === 'update' ||
        selectedSection === 'delete'
      "
    >

      <div class="content-header">

        <h1>
          Products
        </h1>

        <p>
          Manage products
        </p>

      </div>

      <div class="products-grid">

        <div
          class="product-card"
          *ngFor="
            let product
            of products
          "
        >


          <div>



            <input
              *ngIf="
                selectedSection === 'update'
              "
              type="text"
              [(ngModel)]="product.name"
              class="edit-input"
            >

            <h2
              *ngIf="
                selectedSection !== 'update'
              "
            >
              {{ product.name }}
            </h2>



            <p>
              {{ product.description }}
            </p>

          </div>

   

          <div class="product-info">

            <div>

              <span>
                Price
              </span>

      

              <input
                *ngIf="
                  selectedSection === 'update'
                "
                type="number"
                [(ngModel)]="product.price"
                class="
                  edit-input
                  small-input
                "
              >

       

              <h3
                *ngIf="
                  selectedSection !== 'update'
                "
              >
                ₹ {{ product.price }}
              </h3>

            </div>

          </div>

  

          <div
            class="product-actions"

            *ngIf="
              selectedSection === 'update' ||
              selectedSection === 'delete'
            "
          >



            <button
              *ngIf="
                selectedSection === 'update'
              "
              class="edit-btn"
              (click)="editProduct(product)"
            >
              Save
            </button>


            <button
              *ngIf="
                selectedSection === 'delete'
              "
              class="delete-btn"
              (click)="deleteProduct(product.id)"
            >
              Delete
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
