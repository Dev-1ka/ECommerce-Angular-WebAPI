<div
  *ngIf="product"

  style="
    padding:40px;
    background:#f5f5f5;
    min-height:100vh;
  "
>

  <div
    style="
      background:white;
      padding:40px;
      border-radius:20px;
      max-width:700px;
      margin:auto;
      box-shadow:
        0 4px 10px rgba(0,0,0,0.08);
    "
  >

    <!-- NAME -->

    <h1
      style="
        margin-bottom:20px;
      "
    >
      {{ product.name }}
    </h1>

    <!-- DESCRIPTION -->

    <div
      style="
        margin-bottom:30px;
      "
    >

      <h3>
        Description
      </h3>

      <p
        style="
          color:#6b7280;
          line-height:1.7;
          margin-top:10px;
        "
      >
        {{ product.description }}
      </p>

    </div>

    <!-- PRICE -->

    <h2
      style="
        margin-bottom:30px;
      "
    >
      ₹ {{ product.price }}
    </h2>

    <!-- QUANTITY -->

    <div
      style="
        display:flex;
        align-items:center;
        gap:15px;
        margin-bottom:30px;
      "
    >

      <button

        (click)="
          decreaseQuantity()
        "

        style="
          width:40px;
          height:40px;
          border:none;
          border-radius:10px;
          background:black;
          color:white;
          cursor:pointer;
        "
      >

        -

      </button>

      <h2>
        {{ quantity }}
      </h2>

      <button

        (click)="
          increaseQuantity()
        "

        style="
          width:40px;
          height:40px;
          border:none;
          border-radius:10px;
          background:black;
          color:white;
          cursor:pointer;
        "
      >

        +

      </button>

    </div>

    <!-- ADD TO CART -->

    <button

      (click)="
        addToCart()
      "

      style="
        width:100%;
        border:none;
        padding:16px;
        border-radius:12px;
        background:black;
        color:white;
        font-size:16px;
        cursor:pointer;
      "
    >

      Add To Cart

    </button>

  </div>

</div>
