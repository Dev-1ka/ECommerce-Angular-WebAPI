<div
  style="
    padding:40px;
    background:#f5f5f5;
    min-height:100vh;
  "
>

  <h1
    style="
      margin-bottom:30px;
    "
  >
    My Cart
  </h1>

  <!-- EMPTY -->

  <div

    *ngIf="
      cartItems.length === 0
    "

    style="
      background:white;
      padding:40px;
      border-radius:20px;
      text-align:center;
    "
  >

    <h2>
      Your cart is empty
    </h2>

  </div>

  <!-- CART ITEMS -->

  <div

    *ngFor="
      let item of cartItems
    "

    style="
      background:white;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    "
  >

    <!-- LEFT -->

    <div>

      <h2>
        {{ item.productName }}
      </h2>

      <p>
        ₹ {{ item.price }}
      </p>

    </div>

    <!-- RIGHT -->

    <div
      style="
        display:flex;
        align-items:center;
        gap:10px;
      "
    >

      <button

        (click)="
          decreaseQuantity(item)
        "

        style="
          width:35px;
          height:35px;
          border:none;
          background:black;
          color:white;
          border-radius:6px;
          cursor:pointer;
        "
      >

        -

      </button>

      <span>

        {{ item.quantity }}

      </span>

      <button

        (click)="
          increaseQuantity(item)
        "

        style="
          width:35px;
          height:35px;
          border:none;
          background:black;
          color:white;
          border-radius:6px;
          cursor:pointer;
        "
      >

        +

      </button>

      <button

        (click)="
          removeFromCart(item.id)
        "

        style="
          border:none;
          background:red;
          color:white;
          padding:10px 14px;
          border-radius:6px;
          cursor:pointer;
          margin-left:10px;
        "
      >

        Delete

      </button>

    </div>

  </div>

  <!-- TOTAL -->

  <div

    *ngIf="
      cartItems.length > 0
    "

    style="
      margin-top:30px;
    "
  >

    <h2
      style="
        color:rgb(122,0,47);
      "
    >

      Total:
      ₹ {{ totalAmount }}

    </h2>

  </div>

  <!-- CHECKOUT -->

  <button

    *ngIf="
      cartItems.length > 0
    "

    (click)="
      checkout()
    "

    style="
      width:100%;
      margin-top:20px;
      padding:18px;
      border:none;
      border-radius:16px;
      background:black;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
    "
  >

    Proceed To Checkout

  </button>

</div>
