<div
  style="
    padding:40px;
    background:#f5f5f5;
    min-height:100vh;
  "
>

  <h1
    style="
      margin-bottom:30px;
    "
  >
    My Orders
  </h1>



  <div

    *ngIf="
      orders.length === 0
    "

    style="
      background:white;
      padding:40px;
      border-radius:20px;
      text-align:center;
    "
  >

    No Orders Found

  </div>

  

  <div

    *ngFor="
      let order of orders
      let i = index
    "

    style="
      background:white;
      padding:25px;
      border-radius:20px;
      margin-bottom:25px;
    "
  >

 

    <div
      style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
      "
    >

      <div>

        <h2>
          Order #{{ i + 1 }}
        </h2>

        <p>
          {{ order.orderId }}
        </p>

      </div>

      <div>

        <h3>
          ₹ {{ order.totalAmount }}
        </h3>

        <p>
          {{ order.status }}
        </p>

      </div>

    </div>



    <p
      style="
        margin-bottom:20px;
        color:gray;
      "
    >
      {{ order.createdAt | date }}
    </p>


    <div

      *ngFor="
        let item of order.items
      "

      style="
        border-top:1px solid #eee;
        padding:15px 0;
      "
    >

      <h3>
        {{ item.productName }}
      </h3>

      <p>
        Quantity:
        {{ item.quantity }}
      </p>

      <p>
        ₹ {{ item.price }}
      </p>

    </div>

 

    <button

      *ngIf="
        order.status === 'Pending'
      "

      (click)="
        payOrder(order.orderId)
      "

      style="
        margin-top:20px;
        width:100%;
        border:none;
        padding:16px;
        border-radius:12px;
        background:black;
        color:white;
        cursor:pointer;
      "
    >

      Pay Now

    </button>



    <div

      *ngIf="
        order.status === 'Paid'
      "

      style="
        margin-top:20px;
        background:#dcfce7;
        color:#166534;
        padding: 20px;
        text-align:center;
        font-weight:600;
      "
    >

      Payment Completed

    </div>


    <div

      *ngIf="
        order.status === 'Shipped'
      "

      style="
        margin-top:20px;
        background:#ffeabd;
        color:#7e4300;
        padding: 20px;
        text-align:center;
        font-weight:600;
      "
    >

      Shipped

    </div>
    
    <div

      *ngIf="
        order.status === 'Delivered'
      "

      style="
        margin-top:20px;
        background:#badaff;
        color:#120053;
        padding: 20px;
        text-align:center;
        font-weight:600;
      "
    >

      Delivered

    </div>

  </div>

</div>
