<div class="accept-container">

  <div class="accept-card">

    <h1>
      Accept Invite
    </h1>

    <p>
      Complete account setup
    </p>

    <form
      [formGroup]="acceptForm"
      (ngSubmit)="acceptInvite()"
    >


      <div class="form-group">

        <label>
          Full Name
        </label>

        <input
          type="text"
          formControlName="fullName"
        >

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          formControlName="password"
        >

      </div>

      <button type="submit">

        Activate Account

      </button>

    </form>

  </div>

</div>
