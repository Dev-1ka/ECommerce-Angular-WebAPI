<div class="container mt-5">

  <div class="card p-4 shadow">

    <h2 class="mb-4">
      Send Invite
    </h2>

    <form
      [formGroup]="inviteForm"
      (ngSubmit)="sendInvite()"
    >

      <div class="mb-3">

        <label>Email</label>

        <input
          type="email"
          class="form-control"
          formControlName="email"
        >

      </div>

      <div class="mb-3">

        <label>Role</label>

        <select
          class="form-select"
          formControlName="role"
        >

          <option value="">
            Select Role
          </option>

          <option value="Admin">
            Admin
          </option>

          <option value="ProductManager">
            Product Manager
          </option>

        </select>

      </div>

      <button
        class="btn btn-primary"
        type="submit"
      >
        Send Invite
      </button>

    </form>

  </div>

</div>
